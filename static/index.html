<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wi-Fi Network Map</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">LOCAL NETWORK OBSERVATORY</p>
        <h1>Wi-Fi Network Map</h1>
        <p id="summary">Waiting for the first discovery pass…</p>
      </div>
      <div class="actions">
        <select id="profile" aria-label="Scan profile">
          <option value="discovery">Discovery</option>
          <option value="standard" selected>Standard</option>
          <option value="deep">Deep (privileged)</option>
        </select>
        <button id="scan">Scan now</button>
        <a class="export" href="/api/export.csv">Export CSV</a>
      </div>
    </header>
    <main>
      <section class="map-card">
        <div class="legend"><span class="online"></span>Online <span class="offline"></span>Offline</div>
        <svg id="map" viewBox="0 0 1000 620" aria-label="Network topology"></svg>
      </section>
      <aside>
        <h2>Devices</h2>
        <div id="devices"></div>
      </aside>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
